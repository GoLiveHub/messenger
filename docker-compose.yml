services:
  app:
    build: .
    expose:
      - "3001"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      REDIS_URL: redis://redis:6379
    volumes:
      - app-data:/app/data
      - backups-data:/app/data/backups
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3001/api/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --protected-mode yes
      --save 60 1
      --appendfsync everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

  nginx:
    # Official-nginx-based image w/ ngx_brotli + HTTP/3 (QUIC) + zstd.
    image: macbre/nginx-http3:latest
    ports:
      - "80:80"
      - "443:443/tcp"
      - "443:443/udp"   # HTTP/3 / QUIC
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx/certs:/etc/nginx/ssl:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - app
    # Healthcheck requires the certs to exist (see scripts/gen-certs.sh)
    restart: unless-stopped
    networks:
      - backend

volumes:
  redis-data:
  app-data:
  backups-data:
  certbot-webroot:

networks:
  backend:
    driver: bridge