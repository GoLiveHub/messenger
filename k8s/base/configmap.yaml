apiVersion: v1
kind: ConfigMap
metadata:
  name: messenger-config
  namespace: messenger
data:
  NODE_ENV: "production"
  PORT: "3001"
  LOG_LEVEL: "info"
  DATA_DIR: "/app/data"
  STORAGE_DIR: "/app/data/storage"
  DATA_RETENTION_DAYS: "30"
  VAPID_SUBJECT: "https://messenger.internal"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: messenger-nginx-config
  namespace: messenger
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    events { worker_connections 1024; }
    http {
      server_tokens off;
      upstream app { server app:3001; }
      server {
        listen 80;
        location /api/ { proxy_pass http://app;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade"; }
        location /socket.io/ { proxy_pass http://app;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade"; }
        location /media/ { proxy_pass http://app; }
        location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
      }
    }